on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

name: Release metadata (manual)

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: simple