name: ATBA Modern · Signed build (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ATBA_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ATBA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ATBA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require user-managed production signing
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$ATBA_STORE_PASSWORD" || { echo 'Missing ANDROID_STORE_PASSWORD'; exit 1; }
          test -n "$ATBA_KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$ATBA_KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/atba-release.jks"
          printf 'ATBA_STORE_FILE=%s\n' "$RUNNER_TEMP/atba-release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: SQLite test dependency
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: All required checks
        run: bash tool/ci_verify.sh
      - name: Compile signed ARM64 APK
        run: |
          flutter build apk --release --target-platform android-arm64
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/ATBA-Modern-arm64-v8a-signed.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ATBA-Modern-signed-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/atba-release.jks"
