name: ATBA Modern · Validate and APK
on:
  push:
    branches: [main, feat/atba-modern-overhaul]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      universal:
        description: Generate an additional universal debug APK
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: modern-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/atba-flutter
          key: flutter-source-${{ runner.os }}-6a19cca56475dbfba1478ee68d7bd0c2ef891da1
      - name: Bootstrap pinned official Flutter SDK
        run: bash tool/setup_flutter.sh "$RUNNER_TEMP/atba-flutter"
      - name: Native SQLite for persistence and migration tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Generate, format, analyze and test app and packages
        run: bash tool/ci_verify.sh
  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/atba-flutter
          key: flutter-source-${{ runner.os }}-6a19cca56475dbfba1478ee68d7bd0c2ef891da1
      - name: Bootstrap pinned official Flutter SDK
        run: bash tool/setup_flutter.sh "$RUNNER_TEMP/atba-flutter"
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Compile installable ARM64 test APK (standard Android debug signing)
        run: |
          flutter build apk --debug --target-platform android-arm64
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/ATBA-Modern-arm64-v8a.apk
      - name: Compile universal test APK when requested
        if: github.event_name == 'workflow_dispatch' && inputs.universal
        run: |
          flutter build apk --debug --target-platform android-arm,android-arm64,android-x64
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/ATBA-Modern-universal.apk
      - name: Verify APK files and record checksums
        run: |
          test -s artifacts/ATBA-Modern-arm64-v8a.apk
          ATBA_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$ATBA_BUILD_TOOLS/apksigner"
          for apk in artifacts/*.apk; do
            unzip -t "$apk" > /dev/null
            "$ATBA_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk"
            ATBA_APK_BADGING=$("$ATBA_BUILD_TOOLS/aapt2" dump badging "$apk")
            printf '%s\n' "$ATBA_APK_BADGING" | head -12
            printf '%s\n' "$ATBA_APK_BADGING" | grep -q "package: name='com.eibyx.atbamodern.debug'"
            if [[ "$apk" == *arm64-v8a.apk ]]; then
              ATBA_ABIS=$(unzip -Z -1 "$apk" | sed -n 's@^lib/\([^/]*\)/.*@\1@p' | sort -u)
              test "$ATBA_ABIS" = arm64-v8a
            fi
            ATBA_APK_HASH=$(sha256sum "$apk" | cut -d ' ' -f1)
            ATBA_APK_BYTES=$(stat -c%s "$apk")
            echo "::notice title=Verified APK::${apk##*/}; bytes=$ATBA_APK_BYTES; sha256=$ATBA_APK_HASH; signature=verified"
          done
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
          cat artifacts/SHA256SUMS.txt
          ls -lh artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ATBA-Modern-Android-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
